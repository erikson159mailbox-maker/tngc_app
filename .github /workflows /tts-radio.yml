name: Auto Generate Edge-TTS Radio MP3

on:
  push:
    paths:
      - 'audio/episodes.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audio:
    runs-on: ubuntu-latest
    steps:
      - name: 取得最新專案檔案
        uses: actions/checkout@v4

      - name: 安裝免費 Edge-TTS 台灣自然人聲套件
        run: pip install edge-tts

      - name: 執行陳哥與小恩雙人語音合成
        run: python scripts/generate_radio.py

      - name: 自動將產出的 MP3 存回專案
        run: |
          git config user.name "NewGraceRadioBot"
          git config user.email "bot@newgrace.tw"
          git add audio/mp3/*.mp3
          git commit -m "🎙️ 自動產出最新電台自然人聲 MP3" || exit 0
          git push
